<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Custom Objects Manager</title>
  <!-- SAP Fundamental Styles — same as the sample -->
  <link href="https://unpkg.com/fundamental-styles@latest/dist/fundamental-styles.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body style="margin:0; height:100vh; overflow:hidden;">

  <!-- Loading overlay — hidden once Shell context arrives -->
  <div id="loading-overlay">
    <div class="load-icon">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <path d="M6 9h16M6 14h12M6 19h14" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <h2>Custom Objects Manager</h2>
    <p id="load-msg">Connecting to SAP FSM Shell…</p>
    <!-- Live diagnostic log — always visible so you can see the handshake -->
    <div id="boot-log" style="margin-top:18px; width:min(520px,90vw); max-height:300px; overflow:auto;
         background:#1d2129; color:#cbd5e0; font-family:monospace; font-size:11px;
         border-radius:6px; padding:10px 12px; text-align:left; line-height:1.6;"></div>
  </div>


  <!-- Top bar (hidden when inside Shell — Shell provides its own) -->
  <div id="top-bar" class="fd-shellbar">
    <div class="fd-shellbar__group fd-shellbar__group--product">
      <span class="fd-shellbar__logo">
        <img src="//unpkg.com/fundamental-styles/dist/images/sap-logo.png"
             srcset="//unpkg.com/fundamental-styles/dist/images/sap-logo@2x.png 1x"
             width="48" height="24" alt="SAP">
      </span>
      <span class="fd-shellbar__title">Custom Objects Manager</span>
    </div>
  </div>

  <!-- App body -->
  <div class="app-body">

    <!-- Side navigation (hidden when inside Shell — Shell uses its own Luigi sidebar) -->
    <div id="side-nav" class="app-nav">
      <div class="fd-side-nav">
        <nav class="fd-side-nav__main-navigation" aria-label="Main Menu">
          <ul class="fd-nested-list fd-nested-list--text-only" aria-label="Main Menu">
            <li class="fd-nested-list__item">
              <a id="side-objects" class="fd-nested-list__link" href="#/objects">
                <i role="presentation" class="fd-nested-list__icon sap-icon--database"></i>
                <span class="fd-nested-list__title">Custom Objects</span>
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </div>

    <!-- Main content area -->
    <div id="app-main" class="app-main">

      <!-- ── SECTION: Object list ─────────────────────────── -->
      <section id="section-objects" class="section-hidden">
        <div class="co-toolbar">
          <div class="co-toolbar-left">
            <span class="co-toolbar-title">Custom Objects</span>
          </div>
          <div class="co-toolbar-right">
            <button class="co-btn co-btn--icon" id="btn-refresh" title="Refresh">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 4v5h-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>

        <div class="co-search">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
            <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.4"/>
            <path d="M9.5 9.5L13 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <input id="obj-search" type="text" placeholder="Search custom objects…" autocomplete="off" spellcheck="false"/>
        </div>

        <div class="co-obj-scroll" id="obj-list">
          <div class="co-loading-row"><div class="co-spinner"></div>Loading objects…</div>
        </div>
      </section>

      <!-- ── SECTION: Records ─────────────────────────────── -->
      <section id="section-records" class="section-hidden">
        <div class="co-toolbar">
          <div class="co-toolbar-left">
            <span class="co-toolbar-title" id="rec-title">Records</span>
            <span class="co-badge" id="rec-count">—</span>
          </div>
          <div class="co-toolbar-right">
            <button class="co-btn co-btn--ghost" id="btn-back-to-objects" title="Back to objects">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Back
            </button>
            <button class="co-btn co-btn--ghost" id="btn-export" title="Export CSV">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Export
            </button>
            <button class="co-btn co-btn--primary" id="btn-new-rec" title="New record">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
              New
            </button>
          </div>
        </div>

        <div class="co-filter-bar">
          <div class="co-filter-wrap">
            <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
              <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.4"/>
              <path d="M9.5 9.5L13 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <input class="co-filter-input" id="rec-filter" type="text" placeholder="Filter records…" autocomplete="off" spellcheck="false"/>
          </div>
        </div>

        <div class="co-loading-row" id="rec-loading" style="display:none">
          <div class="co-spinner"></div><span id="rec-load-lbl">Loading records…</span>
        </div>

        <div class="co-table-wrap">
          <table class="co-grid">
            <thead id="t-head"></thead>
            <tbody id="t-body"></tbody>
          </table>
          <div class="co-tbl-empty" id="tbl-empty" style="display:none">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
              <rect x="5" y="10" width="30" height="24" rx="3" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 2.5"/>
              <path d="M12 18h16M12 23h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".4"/>
            </svg>
            <p>No records found</p>
          </div>
        </div>
      </section>

      <!-- ── SECTION: Record detail ───────────────────────── -->
      <section id="section-detail" class="section-hidden">
        <div class="co-toolbar">
          <div class="co-toolbar-left">
            <button class="co-btn co-btn--ghost" id="btn-back-to-records" title="Back to records">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Back
            </button>
            <span class="co-toolbar-title" id="detail-title">Record</span>
          </div>
          <div class="co-toolbar-right">
            <button class="co-btn co-btn--danger" id="btn-delete" style="display:none" title="Delete record">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 13h12l1-13M9 7V4h6v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Delete
            </button>
            <button class="co-btn co-btn--primary" id="btn-save" title="Save record">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Save
            </button>
          </div>
        </div>

        <div class="co-detail-body">
          <div class="co-rec-hero">
            <h2 id="rec-title-detail">Record</h2>
            <span class="co-rec-badge is-new" id="rec-badge">NEW</span>
          </div>
          <div class="co-form-grid" id="rec-form"></div>
        </div>

        <div class="co-save-bar" id="save-bar" style="display:none"></div>
      </section>

      <!-- ── SECTION: Not found ───────────────────────────── -->
      <section id="section-not-found" class="section-hidden">
        <div style="padding:40px; font-family:'72',Arial,sans-serif; color:#4a5568;">
          <h2 style="font-size:18px;margin-bottom:8px;">Page not found</h2>
          <p>The requested page does not exist. <a href="#/objects">Go to Custom Objects</a></p>
        </div>
      </section>

    </div><!-- /#app-main -->
  </div><!-- /.app-body -->

  <!-- Debug panel -->
  <button id="dbg-btn">🐛 Debug</button>
  <div id="dbg-panel">
    <div id="dbg-bar">
      <span>API Debug Log</span>
      <button id="dbg-clear">Clear</button>
      <button id="dbg-copy">Copy All</button>
    </div>
    <div id="dbg-log"><div class="dbg-empty">No API calls yet…</div></div>
  </div>

  <!-- Scripts — same load order as the sample -->
  <script src="https://unpkg.com/fsm-shell"></script>
  <script src="https://unpkg.com/@luigi-project/client/luigi-client.js"></script>
  <script src="src/fsm-api.js"></script>
  <script src="src/csv-utils.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
